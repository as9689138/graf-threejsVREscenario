<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Escenario VR diurno • Juego de pelotas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.1/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.1/examples/jsm/"
    }
  }
  </script>
</head>

<body>
  <div id="hud">
    <div class="badge"><span>Meta:</span> <b>5 pelotas</b></div>
    <div class="badge"><span>Total pelotas:</span> <b id="totalBalls">0</b></div>
    <div class="badge"><span>Tocadas:</span> <b id="hitBalls">0</b></div>
    <div id="compass">N ↑</div>
    <canvas id="minimap" width="150" height="150"></canvas>
  </div>

  <audio id="ambient" src="assets/audio/forest_night.mp3" preload="auto" loop></audio>

  <canvas id="scene"></canvas>
  <script type="module" src="main.js"></script>
</body>
</html>
